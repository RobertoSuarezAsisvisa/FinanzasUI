<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

@if (isAuthPage()) {
  <router-outlet></router-outlet>
} @else {
<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <button type="button" class="sidebar-backdrop" [class.open]="menuOpen" aria-label="Cerrar menu lateral" (click)="closeMenu()"></button>

  <aside class="app-sidebar" [class.open]="menuOpen">
    <a class="brand" routerLink="/dashboard" (click)="menuOpen = false">
      <span class="brand-mark">F</span>
      <span class="brand-copy">
        <strong>Finanzas</strong>
        <small>Control personal</small>
      </span>
    </a>

    <nav>
      <ng-container *ngFor="let item of navItems">
        <div class="nav-group" *ngIf="item.children?.length; else singleNavItem">
          <button
            type="button"
            class="nav-parent"
            [class.active]="isRouteActive(item.route, false)"
            [class.expanded]="isSectionExpanded(item)"
            (click)="toggleSection(item.label)"
          >
            <span class="nav-parent-main">
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </span>
            <i class="pi pi-angle-down nav-chevron"></i>
          </button>

          <div class="nav-children" *ngIf="isSectionExpanded(item)">
            <a
              *ngFor="let child of item.children"
              [routerLink]="child.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-child"
              (click)="closeMenu()"
            >
              <i [class]="child.icon"></i>
              <span>{{ child.label }}</span>
            </a>
          </div>
        </div>

        <ng-template #singleNavItem>
          <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" (click)="closeMenu()">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </ng-template>
      </ng-container>
    </nav>
  </aside>

  <div class="app-main">
    <p-toolbar styleClass="topbar">
      <div class="topbar-left">
        <button
          pButton
          type="button"
          [icon]="sidebarCollapsed ? 'pi pi-angle-right' : 'pi pi-bars'"
          text
          rounded
          class="menu-button"
          [attr.aria-label]="sidebarCollapsed ? 'Abrir menu lateral' : 'Cerrar menu lateral'"
          (click)="toggleSidebar()"
        ></button>
        <span>Finanzas UI</span>
      </div>
      <div class="topbar-actions">
        <span class="api-pill">{{ auth.user()?.displayName || auth.user()?.email }}</span>
        <button pButton type="button" icon="pi pi-sign-out" text rounded aria-label="Cerrar sesion" (click)="logout()"></button>
      </div>
    </p-toolbar>

    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
}
